name: One-time v2.1 dead CSS cleanup

on:
  push:
    branches:
      - chore/v2.1-css-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/v2.1-css-cleanup
          fetch-depth: 0

      - name: Remove retired legacy-link rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/calculator/ReactCalculator.css')
          text = path.read_text()
          block = '''.calculator-legacy-link {
  padding: 9px 13px;
  border: 1px solid #d6dbe7;
  border-radius: 9px;
  color: #31405f;
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
}

'''
          if block not in text:
              raise SystemExit('Expected retired legacy-link rule was not found')
          path.write_text(text.replace(block, '', 1))
          PY
          git diff --check

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2.1-dead-css-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired legacy link styling'
          git push origin HEAD:chore/v2.1-css-cleanup
