name: Stable version sync

on:
  push:
    branches:
      - release/v2.0.0

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v2.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package lock version
        run: npm version 2.0.0 --no-git-tag-version --allow-same-version
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Synchronize stable v2.0.0 lockfile"
          git push origin HEAD:release/v2.0.0
