name: One-time v2.1 E2E selector cleanup

on:
  push:
    branches:
      - chore/v2.1-css-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/v2.1-css-cleanup
          fetch-depth: 0

      - name: Normalize Playwright selectors
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl --include='*.ts' 'preview-' e2e || true)
          for file in "${files[@]}"; do
            sed -i 's/preview-/calculator-/g' "$file"
          done

          if grep -RIn 'preview-' e2e; then
            echo 'Preview-era selectors remain in e2e.' >&2
            exit 1
          fi

          git diff --check

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2.1-e2e-selector-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update browser selectors for calculator namespace'
          git push origin HEAD:chore/v2.1-css-cleanup
