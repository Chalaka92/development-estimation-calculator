name: One-time v2.1 CSS namespace cleanup

on:
  push:
    branches:
      - chore/v2.1-css-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/v2.1-css-cleanup
          fetch-depth: 0

      - name: Normalize calculator stylesheet namespace
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(grep -RIl --include='*.tsx' --include='*.css' 'preview-' src || true)
          for file in "${files[@]}"; do
            sed -i 's/preview-/calculator-/g' "$file"
          done

          sed -i 's/react-preview/react-calculator/g' src/features/calculator/ReactCalculator.tsx src/features/calculator/ReactCalculatorPreview.css
          sed -i 's#\./ReactCalculatorPreview\.css#./ReactCalculator.css#' src/features/calculator/ReactCalculator.tsx
          mv src/features/calculator/ReactCalculatorPreview.css src/features/calculator/ReactCalculator.css

          python - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          old = '- [ ] Normalize the remaining preview-era stylesheet and CSS selector namespace without changing the visual design.'
          new = '- [x] Normalize the remaining preview-era stylesheet and CSS selector namespace without changing the visual design.'
          if old not in text:
              raise SystemExit('Expected v2.1 roadmap item was not found')
          roadmap.write_text(text.replace(old, new, 1))
          PY

          if grep -RInE 'ReactCalculatorPreview\.css|react-preview|preview-' src; then
            echo 'Preview-era stylesheet namespace remains in src.' >&2
            exit 1
          fi

          git diff --check

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2.1-css-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize calculator stylesheet namespace'
          git push origin HEAD:chore/v2.1-css-cleanup
