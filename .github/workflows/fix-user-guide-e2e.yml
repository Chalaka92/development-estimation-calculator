name: Fix user guide E2E selector

on:
  push:
    branches:
      - feature/in-app-user-guide

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/in-app-user-guide
          fetch-depth: 0
      - name: Tighten PERT selector and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/calculator.spec.ts')
          text = path.read_text()
          old = "await expect(page.getByText('PERT expected')).toBeVisible()"
          new = "await expect(page.getByText('PERT expected', { exact: true })).toBeVisible()"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale selector, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-user-guide-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/calculator.spec.ts
          git commit -m "Tighten PERT browser selector"
          git push origin HEAD:feature/in-app-user-guide
