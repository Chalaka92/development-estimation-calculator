name: Verify v2.1.0 release

on:
  push:
    branches: [release/v2.1.0]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/v2.1.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run release:verify

      - name: Remove one-time workflow
        if: ${{ success() }}
        shell: bash
        run: |
          rm .github/workflows/verify-v2.1.0.yml
          git config user.name "Chalaka92"
          git config user.email "39949831+Chalaka92@users.noreply.github.com"
          git add .github/workflows/verify-v2.1.0.yml
          git commit -m "Complete v2.1.0 release verification"
          git push origin HEAD:release/v2.1.0
